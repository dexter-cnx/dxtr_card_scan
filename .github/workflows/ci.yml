name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: dxtr-card-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Package dependencies
        run: flutter pub get
      - name: Analyze package
        run: flutter analyze
      - name: Test package
        run: flutter test
      - name: Example dependencies
        working-directory: example
        run: flutter pub get
      - name: Analyze example
        working-directory: example
        run: flutter analyze lib
      - name: Scaffold example host platforms
        run: bash tool/bootstrap_example_platforms.sh
      - name: Build Android example (arm64 native integration)
        working-directory: example
        run: flutter build apk --debug --target-platform android-arm64

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Rust format
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: Rust clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

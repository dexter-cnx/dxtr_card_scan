name: dxtr_card_scan_example
description: Camera, gallery crop, and physical calibration evidence tools for dxtr_card_scan.
publish_to: none

version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  camera: ^0.11.0+2
  device_info_plus: ^11.5.0
  file_selector: ^1.0.3
  image: ^4.9.2
  image_picker: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  dxtr_card_scan:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

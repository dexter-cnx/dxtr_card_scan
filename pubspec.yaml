name: dxtr_card_scan
description: OCR-engine-agnostic Flutter card capture UI and geometry foundation for Rust-backed preprocessing.
version: 0.1.0-dev.1
homepage: https://github.com/dexter-cnx/dxtr_card_scan
repository: https://github.com/dexter-cnx/dxtr_card_scan
issue_tracker: https://github.com/dexter-cnx/dxtr_card_scan/issues

publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  camera: ^0.11.0+2
  ffi: ^2.1.4
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  image: ^4.9.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.cnxdev.dxtr_card_scan
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
